<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERD - Back-end 프로젝트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; color: #f8fafc; }
    header span { font-size: 0.85rem; color: #94a3b8; }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px 32px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #cbd5e1;
    }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 3px;
    }

    .canvas-wrap {
      overflow: auto;
      padding: 40px;
      min-height: calc(100vh - 100px);
    }

    svg#erd {
      display: block;
      margin: 0 auto;
    }

    /* Table card styles */
    .table-card rect.header { rx: 6; ry: 6; }
    .table-card text.table-name {
      font-weight: 700;
      font-size: 13px;
      fill: #ffffff;
    }
    .table-card text.field {
      font-size: 11px;
      fill: #cbd5e1;
    }
    .table-card text.field-type {
      font-size: 10px;
      fill: #64748b;
    }
    .table-card text.pk {
      font-size: 10px;
      fill: #fbbf24;
      font-weight: 600;
    }
    .table-card text.fk {
      font-size: 10px;
      fill: #60a5fa;
    }
    .table-card line.divider { stroke: #334155; stroke-width: 1; }

    /* Relationship lines */
    .rel-line {
      stroke: #475569;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: none;
    }
    .rel-line.dashed { stroke-dasharray: 5,3; stroke: #64748b; }
    .rel-label {
      font-size: 10px;
      fill: #94a3b8;
    }

    /* App color themes */
    .app-accounts  { fill: #1d4ed8; }
    .app-community { fill: #15803d; }
    .app-portfolio { fill: #b45309; }
    .app-stocks    { fill: #7c3aed; }
    .app-survey    { fill: #be185d; }

    .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8; ry: 8; }
    .row-bg-alt { fill: #0f172a; }
  </style>
</head>
<body>

  <span>Django · 5개 앱 · 10개 모델</span>

  </div>
</div>

<script>
  // Simple hover highlight
  document.querySelectorAll('.table-card').forEach(card => {
    card.style.cursor = 'default';
    card.addEventListener('mouseenter', () => {
      card.querySelectorAll('rect.card-bg').forEach(r => {
        r.style.stroke = '#60a5fa';
        r.style.strokeWidth = '2';
      });
    });
    card.addEventListener('mouseleave', () => {
      card.querySelectorAll('rect.card-bg').forEach(r => {
        r.style.stroke = '#334155';
        r.style.strokeWidth = '1';
      });
    });
  });
</script>
